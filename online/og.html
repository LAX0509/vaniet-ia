<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Geist", "Segoe UI", system-ui, sans-serif; color: #fff;
    background: radial-gradient(900px 420px at 88% -10%, rgba(37,99,235,.55), transparent 70%), radial-gradient(600px 300px at 0% 0%, rgba(96,165,250,.18), transparent 70%), #0D0F12; position: relative; }
  body::before { content: ""; position: absolute; inset: 0; opacity: .45; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 60px 60px; -webkit-mask-image: linear-gradient(to bottom, #000, transparent 85%); mask-image: linear-gradient(to bottom, #000, transparent 85%); }
  .c { position: relative; padding: 70px 80px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .marca { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 700; letter-spacing: -.03em; }
  .marca svg { width: 72px; height: 72px; }
  .ai { font: 600 22px "Consolas", monospace; color: #60A5FA; border: 2px solid rgba(96,165,250,.45); border-radius: 9px; padding: 2px 10px; letter-spacing: .06em; }
  h1 { font-size: 78px; line-height: 1.04; letter-spacing: -.04em; font-weight: 700; max-width: 900px; }
  h1 span { background: linear-gradient(90deg, #93C5FD, #2563EB); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pie { display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #9AA3B2; }
  .pill { background: #2563EB; color: #fff; font-weight: 600; padding: 14px 28px; border-radius: 14px; font-size: 28px; }
</style></head>
<body><div class="c">
  <div class="marca">
    <svg viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs><rect x=".5" y=".5" width="39" height="39" rx="11" fill="#15181D" stroke="rgba(255,255,255,.18)"/><path d="M11 12.5 20 28l9-15.5" fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="12.5" r="2.6" fill="#fff"/></svg>
    Vaniet <span class="ai">IA</span>
  </div>
  <h1>3 agentes de IA atienden tu <span>WhatsApp</span> mientras tu equipo descansa</h1>
  <div class="pie"><span>Ventas · Citas · Seguimiento automático</span><span class="pill">Pruébalo tú mismo →</span></div>
</div></body></html>
